spring:
  application:
    name: forum-servicev2
  
  datasource:
    url: jdbc:postgresql://192.168.1.37:5432/xmpp_plate
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

  sql:
    init:
      mode: always

server:
  port: 8080
